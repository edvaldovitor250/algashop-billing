spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:billing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:billing}

algashop:
  integrations:
    payment:
      fastpay:
        hostname: ${FASTPAY_HOSTNAME:http://fastpay:9995}
        webhook-url: ${FASTPAY_WEBHOOK_URL:http://billing:8082/api/v1/webhooks/fastpay}
